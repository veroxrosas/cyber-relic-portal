<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cyber Relic Portal · 電子遺物門</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; image-rendering: pixelated; }

  /* mini-game panels (message wall, dress-up studio) */
  .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgba(20, 0, 20, 0.55); z-index: 10; font-family: "DotGothic16", monospace; }
  .panel[hidden] { display: none; }
  .panel form { width: min(92vw, 460px); max-height: 94vh; overflow-y: auto; background: #fff0fa;
                border: 3px solid #2a0018; box-shadow: 10px 10px 0 #ff4fd8; color: #2a0018; touch-action: pan-y; }
  .panel .bar { background: #ff4fd8; padding: 8px 12px; border-bottom: 3px solid #2a0018; letter-spacing: 1px; }
  .panel .body { padding: 14px 12px; display: grid; gap: 10px; }
  .panel input { font: inherit; font-size: 18px; padding: 10px; border: 2px solid #2a0018; background: #fff;
                 color: #2a0018; outline: none; touch-action: auto; }
  .panel input:focus { box-shadow: 0 0 0 3px #7dfcff; }
  .panel .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .panel button { font: inherit; font-size: 16px; padding: 8px 14px; border: 2px solid #2a0018;
                  background: #ffd1ec; color: #2a0018; cursor: pointer; }
  .panel button[type=submit] { background: #fff200; }
  .panel .status { min-height: 1.2em; font-size: 14px; }
  .panel .note { font-size: 12px; opacity: 0.7; }

  #studio-preview { justify-self: center; width: 168px; height: 168px; image-rendering: pixelated;
                    border: 3px solid #2a0018; background: #ffd1ec; }
  .opt { display: grid; grid-template-columns: 80px 40px 1fr 40px; align-items: center; gap: 6px; }
  .opt button { padding: 4px 0; }
  .opt .val { text-align: center; background: #fff; border: 2px solid #2a0018; padding: 5px 4px; }
</style>
</head>
<body>

<div id="studio" class="panel" hidden>
  <form autocomplete="off">
    <div class="bar">✂ 着せ替え · DRESS-UP STUDIO</div>
    <div class="body">
      <canvas id="studio-preview" width="168" height="168"></canvas>
      <div id="studio-opts"></div>
      <input id="studio-name" maxlength="14" placeholder="name your pet ♡" enterkeyhint="done">
      <div class="row">
        <button type="button" id="studio-random">RANDOM ✦</button>
        <button type="button" id="studio-close">CLOSE</button>
        <button type="submit">ADOPT ♥</button>
      </div>
      <div class="status" id="studio-status"></div>
      <div class="note">your pet follows you through every world ✦ it may show up in the fortune game</div>
    </div>
  </form>
</div>

<div id="wall" class="panel" hidden>
  <form autocomplete="off">
    <div class="bar">✉ 留言板 · WRITE ON THE WALL</div>
    <div class="body">
      <input id="wall-input" maxlength="60" placeholder="say something kind & cute ♡" enterkeyhint="send">
      <div class="row">
        <button type="button" id="wall-close">CLOSE</button>
        <button type="submit">SEND ♥</button>
      </div>
      <div class="status" id="wall-status"></div>
      <div class="note" id="wall-note"></div>
    </div>
  </form>
</div>

};

const HATS = {
  bow:     ['22.22', '22322'],
  crown:   ['4.4.4', '22222'],
  halo:    ['.4444.', '......'],
  antenna: ['4', '3'],
  sprout:  ['2.2', '.2.'],
  flower:  ['.4.', '424', '.4.'],
  party:   ['..4..', '..2..', '.232.', '22222'],
  witch:   ['...3...', '..33...', '..333..', '3333333'],
  beret:   ['..3...', '.2222.', '222222'],
  horns:   ['3......3', '33....33'],
  sparkle: ['.4.', '444', '.4.'],
  cherry:  ['3.3', '2.2'],
  tophat:  ['.333.', '.222.', '33333'],
};

// "body eyes mouth hat [blush]"  →  sprite rows
function composePet(spec) {
  const [body, eyes, mouth, hat, ...flags] = spec.split(' ');
  const B = BODIES[body], W = 12, cx = 6, H = HATS[hat] || [];
  const grid = H.map(r => {
    const row = Array(W).fill('.'), x0 = Math.round(cx - r.length / 2);
    Array.from(r).forEach((c, q) => { if (c !== '.' && x0 + q >= 0 && x0 + q < W) row[x0 + q] = c; });
    return row;
  }).concat(B.rows.map(r => Array.from(r.padEnd(W, '.'))));

  const off = H.length;
  const onBody = (x, y, c) => { if (grid[y] && grid[y][x] && grid[y][x] !== '.') grid[y][x] = c; };
  const [ls, rs] = EYE_PAIRS[eyes], lx = cx - B.dx, rx = cx + B.dx - 1, ey = B.eyeY + off;
  EYES[ls].forEach(([dx, dy, c]) => onBody(lx - dx, ey + dy, c));
  EYES[rs].forEach(([dx, dy, c]) => onBody(rx + dx, ey + dy, c));
  if (flags.includes('blush')) { onBody(lx - 1, ey + 2, '2'); onBody(rx + 1, ey + 2, '2'); }
  (MOUTHS[mouth] || []).forEach(([dx, dy, c]) => onBody(cx - 1 + dx, B.mouthY + off + dy, c));
  return grid.map(r => r.join(''));
}

const SPRITES = {};
function registerSprite(key, rows) {
  const w = Math.max(...rows.map(r => r.length));
  SPRITES[key] = { w, h: rows.length, rows: rows.map(r => r.padEnd(w, '.')) };
  return key;
}
Object.entries(SPRITE_ART).forEach(([key, rows]) => registerSprite(key, rows));

// Pet codes: 1 body · 2 accent · 3 ink · 4 shine · 5 white sticker rim · 6 shadow · 7 dark rim
function prepare(sc) {
  if (sc.d) return sc.d;
  const p = sc.palette;
  const byLum = p.slice(1).sort((a, b) => lum(a) - lum(b));
  const body = mix(byLum[3], '#ffffff', 0.3), accent = mix(byLum[1], p[0], 0.1);
  sc.d = {
    pal: p, n: p.length, glyphs: sc.world.glyphArr,
    inkOn: p.map(c => mix(c, p[0], 0.45)),
    pet:    { 1: body, 2: accent, 3: p[0], 4: '#ffffff', 5: '#ffffff', 6: mix(p[0], '#000000', 0.3), 7: p[0] },
    petInk: { 1: mix(body, p[0], 0.3), 2: mix(accent, p[0], 0.35), 3: mix(p[0], '#ffffff', 0.2),
              4: mix('#ffffff', accent, 0.35), 5: mix('#ffffff', accent, 0.45), 6: mix(p[0], '#ffffff', 0.15) },
  };
  return sc.d;
}

// Each returns 0..1 for a cell. u,v = centred coords, r,a = polar, t = seconds.

const FULL_TURN = Math.PI * 2;
const PATTERNS = {
  plasma: (u, v, r, a, t) =>
    (Math.sin(u * 9 + t) + Math.sin(v * 8 - t * 1.3) + Math.sin((u + v) * 7 + t * 0.7) + Math.sin(r * 14 - t * 2)) / 8 + 0.5,

  tunnel: (u, v, r, a, t) =>
    frac(0.35 / (r + 0.03) + t * 0.6) * 0.6 + ((Math.floor(a / Math.PI * 6 + t * 0.5) & 1) ? 0.4 : 0),

  spiral: (u, v, r, a, t) => frac(a / FULL_TURN * 3 + r * 5 - t * 0.7),

  rings: (u, v, r, a, t) => frac(r * 9 + Math.sin(a * 6 + t) * 0.25 - t * 0.9),

  checker: (u, v, r, a, t) => {
    const x = u * 7 + Math.sin(v * 4 + t) * 0.8, y = v * 7 + Math.cos(u * 4 + t * 0.8) * 0.8;
    return ((Math.floor(x) + Math.floor(y)) & 1) * 0.55 + frac((x + y) * 0.5) * 0.45;
  },

  rain: (u, v, r, a, t, i, j) => Math.pow(frac(j * 0.045 - t * (0.3 + hash(i, 7) * 0.8) + hash(i, 3)), 3),

  grid: (u, v, r, a, t) => {
    const h = v - 0.05;
    if (h > 0) {                                        // perspective floor
      const z = 0.25 / h;
      return (frac(z * 0.8 - t * 1.2) < 0.12 || frac(u * z * 1.5) < 0.08) ? 1 : 0.15;
    }
    if (Math.hypot(u, h + 0.22) < 0.2) return frac(h * 18 + t * 0.4) < 0.7 ? 0.9 : 0.35;   // striped sun
    return Math.max(0, 0.45 + h * 1.2);                 // sky gradient
  },

  moire: (u, v, r, a, t) => {
    const d1 = Math.hypot(u - Math.sin(t * 0.5) * 0.3, v - Math.cos(t * 0.4) * 0.2);
    const d2 = Math.hypot(u + Math.sin(t * 0.35) * 0.3, v + Math.cos(t * 0.6) * 0.2);
    return Math.sin(d1 * 60) * Math.sin(d2 * 60) * 0.5 + 0.5;
  },

  stars: (u, v, r, a, t, i, j) => {
    const h = hash(i, j);
    if (h > 0.9) return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 3 + h * 80));
    return frac(0.25 / (r + 0.05) - t * 0.4) < 0.1 ? 0.45 : 0.04;
  },

  kaleido: (u, v, r, a, t) => {
    const seg = Math.PI / 4;
    const b = Math.abs((((a + t * 0.2) % (2 * seg)) + 2 * seg) % (2 * seg) - seg);
    const x = r * Math.cos(b), y = r * Math.sin(b);
    return (Math.sin(x * 18 - t * 2) + Math.sin(y * 22 + t) + Math.sin((x + y) * 10 + t * 1.5)) / 6 + 0.5;
  },

  sunburst: (u, v, r, a, t) =>
    ((Math.floor(a / FULL_TURN * 24 + t * 0.4 + Math.sin(r * 6 - t) * 0.5) & 1) ? 0.75 : 0.2) + frac(r * 3 - t * 0.5) * 0.25,

  hearts: (u, v, r, a, t) => {
    const x = (frac(u * 5 + t * 0.15) * 2 - 1) * 1.35;
    const y = -(frac(v * 5 - t * 0.15) * 2 - 1) * 1.35 + 0.15;
    const q = x * x + y * y - 1;
    return q * q * q - x * x * y * y * y < 0 ? 0.75 + 0.2 * Math.sin(t * 3 + u * 5) : frac((u - v) * 4 + t * 0.3) * 0.35;
  },

  stripes: (u, v, r, a, t) => frac((u + v) * 6 + Math.sin(u * 3 + t) * 0.3 + t * 0.4),

  zigzag: (u, v, r, a, t) => frac(v * 6 + Math.abs(frac(u * 5) - 0.5) * 1.6 - t * 0.5),

  wallpaper: (u, v, r, a, t, i, j, sc) => {             // scrolling tiles of the world's relic item
    const s = SPRITES[sc.buddy], tw = s.w + 3, th = s.h + 2;
    const sx = i + Math.floor(t * 1.5), col = Math.floor(sx / tw), li = ((sx % tw) + tw) % tw;
    const sy = j + (col & 1) * (th >> 1), row = Math.floor(sy / th), lj = sy % th;
    const px = s.rows[lj] && s.rows[lj][li];
    if (px && px !== '.') return 0.4 + Number(px) * 0.18;
    return ((col + row) & 1) ? 0.16 : 0.03;
  },
};


/* ---------- 6. GRID & PET LAYER -------------------------------------- */

let L = null, cell = 16, half = 8;

function buildLayout() {
  cell = Math.max(7, Math.floor(Math.min(width, height) / CFG.gridCells));
  half = cell / 2;
  const cols = Math.ceil(width / cell), rows = Math.ceil(height / cell), N = cols * rows, M = Math.min(cols, rows);
  L = {
    cols, rows, S: Math.max(2, Math.round(M * 0.38 / 12)),      // main-pet pixel scale in cells
    U: new Float32Array(N), V: new Float32Array(N), Rad: new Float32Array(N), Ang: new Float32Array(N),
    code: new Uint8Array(N), owner: new Int8Array(N), gidx: new Uint16Array(N),
    tear: new Int16Array(rows), melt: new Int16Array(cols),
  };
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i, u = (i + 0.5 - cols / 2) / M, v = (j + 0.5 - rows / 2) / M;
    L.U[k] = u; L.V[k] = v; L.Rad[k] = Math.hypot(u, v); L.Ang[k] = Math.atan2(v, u);
  }
}

// Where every pet is this frame: three small friends parading, one big star pet.
function petStates(t, sc) {
  const out = sc.friends.map((pid, k) => {
    const pet = PETS[pid], sp = SPRITES[pet.sprite], dir = k & 1 ? -1 : 1, span = L.cols + sp.w + 6;
    const pos = Math.floor(t * (1.6 + k * 0.5) + k * 17);
    const i0 = ((pos * dir) % span + span) % span - sp.w - 3;
    const j0 = Math.min(L.rows - sp.h - 2, Math.round(L.rows * [0.8, 0.9, 0.7][k] - sp.h / 2)) - (Math.floor(t * 2.4 + k) & 1);
    return { pet, sp, S: 1, i0, j0, face: dir, main: false };
  });

  const pet = sc.pet, sp = SPRITES[pet.sprite], S = L.S;
  const range = Math.max(0, Math.floor(Math.min(L.cols * 0.22, (L.cols - sp.w * S) / 2 - 2)));
  const step = Math.floor(t * 2.2);
  let off = 0, face = 1;
  if (range > 0) {                                   // Tamagotchi-style stepping walk
    const span = 2 * range, p = step % (2 * span);
    off = (p < span ? p : 2 * span - p) - range;
    face = p < span ? 1 : -1;
  }
  const main = {
    pet, sp, S, face, main: true,
    i0: Math.round(L.cols / 2 + off - sp.w * S / 2),
    j0: Math.round(L.rows * 0.46 - sp.h * S / 2) - (step & 1),
  };

  if (customPet) {                                   // your dressed-up pet tags along beside the star
    const csp = SPRITES[customPet.sprite], left = main.i0 - csp.w - 3, right = main.i0 + sp.w * S + 3;
    const beside = left >= 1 || right + csp.w < L.cols - 1;   // narrow screens: walk below the star instead
    out.push({
      pet: customPet, sp: csp, S: 1, face, main: false, custom: true,
      i0: left >= 1 ? left : beside ? right : Math.round(L.cols / 2 + off * 0.5 - csp.w / 2),
      j0: (beside ? main.j0 + sp.h * S - csp.h : main.j0 + sp.h * S + 4) - ((step + 1) & 1),
    });
  }
  out.push(main);
  return out;
}

function buildPetLayer(pets) {
  const { cols, rows, code, owner, gidx } = L;
  code.fill(0); owner.fill(-1);
  const set = (i, j, c, idx, g) => {
    if (i < 0 || j < 0 || i >= cols || j >= rows) return;
    const k = j * cols + i; code[k] = c; owner[k] = idx; gidx[k] = g;
  };
  pets.forEach((p, idx) => {
    const W = p.sp.w * p.S, H = p.sp.h * p.S;
    if (p.main) {
      for (let dj = 0; dj < 2; dj++) for (let di = Math.round(W * 0.15); di < Math.round(W * 0.85); di++) set(p.i0 + di, p.j0 + H + dj, 6, idx, 0);
    }
    for (let dj = 0; dj < H; dj++) for (let di = 0; di < W; di++) {
      const li0 = Math.floor(di / p.S), lj = Math.floor(dj / p.S), li = p.face < 0 ? p.sp.w - 1 - li0 : li0;
      const px = p.sp.rows[lj][li];
      if (px !== '.') set(p.i0 + di, p.j0 + dj, Number(px), idx, li * 7 + lj * 13 + p.pet.id);
    }
    outlineRing(p, idx, W, H, [1, 2, 3, 4], 5);      // white sticker edge
    outlineRing(p, idx, W, H, [5], 7);               // dark outer edge
  });
}

function outlineRing(p, idx, W, H, from, to) {
  const { cols, rows, code, owner } = L;
  const isFrom = n => owner[n] === idx && from.includes(code[n]);
  for (let j = p.j0 - 2; j < p.j0 + H + 2; j++) for (let i = p.i0 - 2; i < p.i0 + W + 2; i++) {
    if (i < 0 || j < 0 || i >= cols || j >= rows) continue;
    const k = j * cols + i;
    if (owner[k] === idx && code[k] !== 6) continue;
    if ((i > 0 && isFrom(k - 1)) || (i < cols - 1 && isFrom(k + 1)) ||
        (j > 0 && isFrom(k - cols)) || (j < rows - 1 && isFrom(k + cols))) {
      code[k] = to; owner[k] = idx;
    }
  }
}


/* ---------- 7. CELL PAINTERS ----------------------------------------- */

let ctx, scanlines, lastPets = [];
let order = [], sceneCursor = 0, prevD = null;
let trans = 0, lastWarp = -1e9, lastShake = -1e9;
let motionAsked = false, motionGranted = !NEEDS_MOTION_PERMISSION, menu = [];

const current = () => SCENES[order[sceneCursor]];

function block(x, y, color) { ctx.fillStyle = color; ctx.fillRect(x, y, cell, cell); }
function glyph(x, y, ch, color) { ctx.fillStyle = color; ctx.fillText(ch, x + half, y + half); }

function pickGlyph(i, j, t, d) {       // each cell slowly re-rolls its character
  return d.glyphs[Math.floor(hash(i, j, Math.floor(t * 0.7 + hash(j, i) * 9)) * d.glyphs.length)];
}

function field(k, i, j, F) {           // background value with a slow hypnotic sway & breathe
  const u0 = L.U[k], v0 = L.V[k];
  const u = (u0 * F.cr - v0 * F.sr) * F.zoom, v = (u0 * F.sr + v0 * F.cr) * F.zoom;
  const f = F.pat(u, v, L.Rad[k] * F.zoom, L.Ang[k] + F.rot, F.t, i, j, F.sc);
  return f < 0 ? 0 : f > 0.999 ? 0.999 : f;
}

function backgroundCell(k, i, j, x, y, F) {
  if (trans > 0 && hash(i, j, frameCount) < trans * 0.4) return glitchCell(i, j, x, y, F);
  if (F.virus && virusCell(i, j, x, y, F)) return;
  const { d, sc, t } = F, f = field(k, i, j, F);
  const ci = 1 + Math.floor(f * 5 + t * sc.cycle) % (d.n - 1);         // palette cycling
  if (sc.style === 'ramp') {
    const ch = RAMP[Math.floor(f * RAMP.length)];
    if (ch !== ' ') glyph(x, y, ch, d.pal[ci]);
  } else if (sc.style === 'pixel') {
    block(x, y, d.pal[ci]);
    glyph(x, y, pickGlyph(i, j, t, d), d.inkOn[ci]);
  } else if (f > 0.5) {
    block(x, y, d.pal[1]);
    glyph(x, y, pickGlyph(i, j, t, d), d.pal[0]);
  } else {
    glyph(x, y, f < 0.22 ? '・' : pickGlyph(i, j, t, d), d.pal[2 + Math.floor(f * 3 + t * sc.cycle) % (d.n - 2)]);
  }
}

function petCell(k, i, j, x, y, F) {
  if (trans > 0 && hash(i, j, frameCount) < trans * 0.25) return glitchCell(i, j, x, y, F);
  const c = L.code[k], d = F.d, colors = lastPets[L.owner[k]].pet.colors || d;
  block(x, y, colors.pet[c]);
  if (c === 7) return;
  const ch = c === 5 ? '♡' : c === 6 ? '・' : c === 4 ? '✦' : d.glyphs[L.gidx[k] % d.glyphs.length];
  glyph(x, y, ch, colors.petInk[c]);
}

function drawNameTag(F) {                  // little plate above your own pet
  const p = lastPets.find(q => q.custom);
  if (!p) return;
  const size = Math.max(10, Math.round(cell * 0.9));
  ctx.textBaseline = 'top';
  label(`♡ ${p.pet.en}`, (p.i0 + p.sp.w / 2) * cell, (p.j0 - 2.2) * cell, size, 'center', F.d.pal);
}

function glitchCell(i, j, x, y, F) {
  const pal = hash(i, j, frameCount + 1) < 0.5 ? F.d.pal : prevD.pal;
  block(x, y, pal[1 + Math.floor(hash(j, i, frameCount) * (pal.length - 1))]);
  glyph(x, y, GLITCH[Math.floor(hash(i, frameCount, j) * GLITCH.length)], pal[0]);
}

function drawEmote(F, p) {             // speech bubble above the big pet
  const V = F.virus, t = F.t;
  const e = oracle ? '札' : V ? (frameCount & 4 ? '菌' : '♡')
          : Math.floor(t / 0.7) % 3 === 0 ? EMOTES[Math.floor(t / 2.1) % EMOTES.length] : null;
  if (!e) return;
  const size = Math.round(cell * p.S * 1.3);
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const w = ctx.measureText(e).width;
  const x = Math.min(width - w - size, (p.i0 + p.sp.w * p.S + 0.5) * cell), y = Math.max(size, (p.j0 - 0.5) * cell);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - size * 0.3, y - size * 0.2, w + size * 0.6, size * 1.4);
  ctx.fillRect(x - size * 0.3, y + size * 1.2, size * 0.35, size * 0.35);
  ctx.strokeStyle = F.d.pal[0]; ctx.lineWidth = 2;
  ctx.strokeRect(x - size * 0.3, y - size * 0.2, w + size * 0.6, size * 1.4);
  ctx.fillStyle = F.d.pet[2];
  ctx.fillText(e, x, y);
}


/* ---------- 7b. THE CUTE VIRUS --------------------------------------- */

let virus = null, nextVirus = 5000;

function updateVirus(now) {
  if (virus && now > virus.start + virus.dur) {
    virus = null;
    nextVirus = now + random(VIRUS.minGapMs, VIRUS.maxGapMs);
  }
  if (!virus && now > nextVirus) {
    const main = random(VIRUS.types), types = new Set([main]);
    if (main === 'popup') types.add(random(['hearts', 'kaomoji', 'clones']));
    virus = {
      types, start: now, dur: random(VIRUS.minDurMs, VIRUS.maxDurMs), seed: Math.floor(random(1e6)),
      x: random(L.cols), y: random(L.rows),
    };
    if (types.has('popup') && !oracle && !fortune) {      // a cascade of error windows, classic-virus style
      const fx = random(0.05, 0.45), fy = random(0.15, 0.4);
      for (let q = 0; q < 4; q++) spawnPopup('error', { fx: fx + q * 0.05, fy: fy + q * 0.07 });
    }
    Sound.virus();
  }
  return virus && { ...virus, p: (now - virus.start) / virus.dur };
}

// Returns true when the virus has painted over this background cell.
function virusCell(i, j, x, y, F) {
  const V = F.virus, C = VIRUS.colors;

  if (V.types.has('hearts')) {              // expanding ring of love
    const r = Math.hypot(i - V.x, j - V.y), rad = V.p * Math.max(L.cols, L.rows) * 0.8;
    if (r < rad && r > rad - 5 - hash(i, j, V.seed) * 4) {
      block(x, y, C[(i + j + frameCount) % C.length]);
      glyph(x, y, (i + j) & 1 ? '♥' : '愛', VIRUS.ink);
      return true;
    }
  }

  if (V.types.has('kaomoji') && hash(j, V.seed) < 0.22) {    // scrolling kaomoji banners
    const s = VIRUS.kaomoji, dir = hash(j, V.seed, 1) < 0.5 ? 1 : -1;
    const n = i + dir * Math.floor(F.t * 18), ch = s[((n % s.length) + s.length) % s.length];
    block(x, y, C[Math.floor(hash(j, V.seed, 2) * C.length)]);
    if (ch !== ' ') glyph(x, y, ch, VIRUS.ink);
    return true;
  }

  if (V.types.has('clones')) {              // the pet multiplies
    const sp = SPRITES[F.sc.pet.sprite], tw = sp.w + 3, th = sp.h + 2;
    const gi = i + V.seed % tw + Math.round(Math.sin(F.t * 6 + j * 0.3) * 1.5), gj = j + (V.seed >> 4) % th;
    const tx = Math.floor(gi / tw), ty = Math.floor(gj / th);
    if (hash(tx, ty, V.seed) < V.p * 1.4) {
      const px = sp.rows[((gj % th) + th) % th]?.[((gi % tw) + tw) % tw];
      if (px && px !== '.') {
        block(x, y, C[(tx + ty + Number(px)) % C.length]);
        glyph(x, y, F.d.glyphs[(i + j) % F.d.glyphs.length], VIRUS.ink);
        return true;
      }
    }
  }
  return false;
}

function negativeD(sc) {                    // photo-negative palette, cached per scene
  if (!sc.neg) sc.neg = prepare({ palette: sc.palette.map(invertHex), world: sc.world });
  return sc.neg;
}

/* ---------- 7b². CUTE POP-UPS ---------------------------------------- */
// Little windows that pop up on their own: errors, progress bars, achievements,
// pet chats, pet status and toasts. They close by themselves; tap one to close it early.

let popups = [], nextPopup = 3000;
const POP_KINDS = ['error', 'error', 'loading', 'achievement', 'chat', 'chat', 'status', 'toast', 'toast'];
const POP_STYLE = {                          // [body, drop shadow, title bar (null = rainbow)]
  error:       ['#fff0fa', '#ff4fd8', null],
  loading:     ['#f0fdff', '#3a86ff', '#7dfcff'],
  achievement: ['#fffbe6', '#c9a227', '#ffd166'],
  chat:        ['#f5fff0', '#70e000', '#b8ff5c'],
  status:      ['#f7f0ff', '#9d4edd', '#c9a7ff'],
  toast:       ['#2a0018', '#ff4fd8', null],
};

function popFill(s) {
  return s.replace('{pet}', titleCase(current().pet.en))
          .replace('{time}', new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
}

function spawnPopup(kind = random(POP_KINDS), at = null) {
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const p = { kind, born: millis(), life: random(POPUPS.minLifeMs, POPUPS.maxLifeMs),
              fx: at ? at.fx : random(0.04, 0.7), fy: at ? at.fy : random(0.14, 0.72) };
  if (kind === 'error')       Object.assign(p, { title: `♡ ${pick(POPUPS.apps)}`, lines: pick(POPUPS.errors).map(popFill), buttons: pick(POPUPS.buttons) });
  if (kind === 'loading')     Object.assign(p, { title: '♡ PROGRESS', task: `${pick(POPUPS.loading)}…`, done: `COMPLETE! ${pick(POPUPS.loaded)}` });
  if (kind === 'achievement') Object.assign(p, { title: '★ ACHIEVEMENT UNLOCKED ★', lines: [popFill(pick(POPUPS.achievements)), `+${10 + Math.floor(Math.random() * 90)} SPARKLE POINTS`] });
  if (kind === 'chat') {
    const pet = pick(PETS);
    Object.assign(p, { pet, title: `✉ ${pet.en}`, lines: [popFill(pick(POPUPS.chats))], colors: petColors(pick(STUDIO_COLORS)[1]).pet });
  }
  if (kind === 'status') {
    Object.assign(p, { title: `${current().pet.en} STATUS`,
      lines: shuffle(POPUPS.stats.slice()).slice(0, 3).map(n => { const v = 1 + Math.floor(Math.random() * 5); return `${n.padEnd(8, ' ')}${'♥'.repeat(v)}${'♡'.repeat(5 - v)}`; }) });
  }
  if (kind === 'toast')       Object.assign(p, { lines: [pick(POPUPS.toasts)] });
  popups.push(p);
  if (popups.length > POPUPS.maxOpen + 4) popups.shift();
  Sound.blip();
}

function updatePopups(now) {
  popups = popups.filter(p => now - p.born < p.life);
  if (now > nextPopup) {
    if (popups.length < POPUPS.maxOpen && !oracle && !fortune && !panelOpen()) spawnPopup();
    nextPopup = now + random(POPUPS.minGapMs, POPUPS.maxGapMs);
  }
}

function popupLines(p, age) {               // body text right now (progress bars count up)
  if (p.kind !== 'loading') return p.lines;
  const pct = Math.min(100, Math.floor(age / (p.life * 0.65) * 100));
  return [p.task, pct < 100 ? `${pct}%` : p.done];
}

function popupSize(p, s) {
  const pad = s * 0.9, sprite = p.kind === 'chat' ? SPRITES[p.pet.sprite] : null, px = Math.max(2, Math.floor(s / 4));
  const lines = p.kind === 'loading' ? [p.task, p.done] : p.lines;
  ctx.font = `${s}px ${FONT}`;
  const spriteW = sprite ? sprite.w * px + s * 0.8 : 0;
  let w = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2 + spriteW;
  if (p.title) w = Math.max(w, ctx.measureText(p.title).width + s * 3);
  if (p.buttons) w = Math.max(w, p.buttons.reduce((sum, b) => sum + ctx.measureText(b).width + s * 1.5, pad * 1.4));
  let h = (p.title ? s * 1.6 : 0) + pad * 1.2 + lines.length * s * 1.5;
  if (p.kind === 'loading') h += s * 1.8;
  if (p.kind === 'error') h += s * 2.2;
  if (sprite) h = Math.max(h, s * 1.6 + pad * 1.4 + sprite.h * px);
  return { w: Math.round(w), h: Math.round(h), pad, spriteW, px };
}

function drawPopups(F) {
  const s = Math.max(12, Math.round(cell)), m = Math.max(14, cell), now = millis();
  popups.forEach(p => {
    const age = now - p.born, { w, h, pad, spriteW, px } = popupSize(p, s);
    const x = Math.round(constrain(p.fx * width, m, width - w - m)), y = Math.round(constrain(p.fy * height, m, height - h - m));
    p.rect = { x, y, w, h };
    const pop = Math.min(1, age / 240), k = pop - 1;
    const scale = (0.5 + 0.5 * (1 + 2.7 * k * k * k + 1.7 * k * k)) * Math.min(1, (p.life - age) / 250);   // pop in, shrink out
    const jiggle = p.kind === 'error' && age < 500 ? Math.sin(age * 0.09) * 3 : 0;
    ctx.save();
    ctx.translate(x + w / 2 + jiggle, y + h / 2); ctx.scale(scale, scale); ctx.translate(-w / 2, -h / 2);
    drawPopupBody(p, w, h, s, pad, spriteW, px, F.t, age);
    ctx.restore();
  });
}

function drawPopupBody(p, w, h, s, pad, spriteW, px, t, age) {
  const [body, shadow, bar] = POP_STYLE[p.kind], ink = VIRUS.ink, dark = p.kind === 'toast';
  ctx.font = `${s}px ${FONT}`; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = shadow; ctx.fillRect(s * 0.45, s * 0.45, w, h);                  // kitsch drop shadow
  ctx.fillStyle = body; ctx.fillRect(0, 0, w, h);
  let y = 0;
  if (p.title) {
    ctx.fillStyle = bar || VIRUS.colors[Math.floor(t * 8) % VIRUS.colors.length];
    ctx.fillRect(0, 0, w, s * 1.6);
    ctx.fillStyle = ink; ctx.fillRect(0, s * 1.6, w, 2);
    ctx.fillText(p.title, pad * 0.5, s * 0.3);
    ctx.textAlign = 'right'; ctx.fillText('×', w - pad * 0.5, s * 0.3); ctx.textAlign = 'left';
    y = s * 1.6;
  }
  ctx.strokeStyle = dark ? '#ff4fd8' : ink; ctx.lineWidth = 2; ctx.strokeRect(1, 1, w - 2, h - 2);
  y += pad * 0.7;

  if (p.kind === 'chat') {                  // the pet who is texting you
    const sp = SPRITES[p.pet.sprite], bob = (Math.floor(t * 3) & 1) * px;
    sp.rows.forEach((row, r) => Array.from(row).forEach((ch, q) => {
      if (ch !== '.') { ctx.fillStyle = p.colors[ch]; ctx.fillRect(pad * 0.6 + q * px, y + r * px + bob, px, px); }
    }));
  }

  const tx = pad + spriteW, lines = popupLines(p, age);
  ctx.fillStyle = dark ? '#ffffff' : ink;
  if (p.kind === 'loading') {
    const pct = Math.min(100, Math.floor(age / (p.life * 0.65) * 100)), bw = w - pad * 2;
    ctx.fillText(lines[0], tx, y);
    y += s * 1.5;
    ctx.strokeStyle = ink; ctx.strokeRect(tx, y, bw, s * 1.2);
    ctx.fillStyle = '#ff4fd8'; ctx.fillRect(tx + 3, y + 3, Math.max(0, (bw - 6) * pct / 100), s * 1.2 - 6);
    ctx.fillStyle = '#ffffff'; ctx.fillText('♥', tx + 3 + Math.max(0, (bw - 6) * pct / 100 - s), y + s * 0.1);
    y += s * 1.8;
    ctx.fillStyle = ink; ctx.fillText(lines[1], tx, y);
  } else {
    lines.forEach((line, q) => {
      if (p.kind === 'achievement' && q === 1) ctx.fillStyle = '#a3123f';
      ctx.fillText(line, tx, y + q * s * 1.5);
    });
  }

  if (p.kind === 'error') {                 // buttons that all say yes, laid out right to left
    let bx = w - pad * 0.7;
    const by = h - s * 2.1;
    p.buttons.forEach(b => {
      const bw = ctx.measureText(b).width + s;
      bx -= bw;
      ctx.fillStyle = '#ffd1ec'; ctx.fillRect(bx, by, bw, s * 1.5);
      ctx.strokeStyle = ink; ctx.strokeRect(bx, by, bw, s * 1.5);
      ctx.fillStyle = ink; ctx.fillText(b, bx + s * 0.5, by + s * 0.25);
      bx -= s * 0.5;
    });
  }
}

function popupTap(x, y) {                   // tap a pop-up to close it; returns true if one was hit
  for (let q = popups.length - 1; q >= 0; q--) {
    const r = popups[q].rect;
    if (r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      popups.splice(q, 1);
      Sound.blip();
      return true;
    }
  }
  return false;
}

function timeKey(h) {
  return h < 4 ? 'witching' : h < 7 ? 'dawn' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
}

// Season follows the bazi month's element (solar calendar): 木 spring, 火 summer, 金 autumn,
// 水 winter, and 土 months are the in-between "doorway" weeks.
function seasonKey(cal) {
  return ['spring', 'summer', 'transition', 'autumn', 'winter'][cal.monthElement];
}

function greeting(h) {
  const G = { ja: h < 11 ? 'おはよう' : h < 18 ? 'こんにちは' : 'こんばんは', zh: '你好', es: 'hola', fr: 'coucou',
              pt: 'oi', ko: '안녕', it: 'ciao', de: 'hallo' };
  return G[(navigator.language || 'en').slice(0, 2)] || 'hey';
}

function readVibe(pet, el, cal) {
  const P = Persona, now = new Date(), h = now.getHours(), wd = now.getDay();
  const tk = timeKey(h), trait = (key, label) => ({ key, label });
  const openers = [trait(tk, TIME_TRAITS[tk])];

  if (wd === 1) openers.push(trait('monday', 'MONDAY WARRIOR'));
  else if (wd === 5) openers.push(trait('friday', 'FRIDAY SPARKLE'));
  else if (wd === 0 || wd === 6) openers.push(trait('weekend', 'WEEKEND SOUL'));

  if (P.daysAway >= 7) openers.push(trait('longlost', 'LONG-LOST FRIEND'));
  else if (P.visits === 1) openers.push(trait('first', 'NEW SOUL'));
  else if (P.visits >= 6) openers.push(trait('regular', 'PORTAL REGULAR'));
  else openers.push(trait('returning', 'RETURNING SPIRIT'));

  if (P.gaps.length >= 3) {
    const avg = P.gaps.reduce((a, b) => a + b, 0) / P.gaps.length;
    openers.push(avg < 4 ? trait('restless', 'RESTLESS WARPER') : avg > 15 ? trait('gazer', 'SLOW GAZER') : trait('drifter', 'DREAMY DRIFTER'));
  }
  if (P.shakes >= 3 && P.shakes >= P.taps) openers.push(trait('shaker', 'SNOW-GLOBE SHAKER'));
  const mins = Math.floor((Date.now() - P.t0) / 60000);
  if (mins >= 10) openers.push(trait('deep', 'DEEP DIVER'));
  if (P.cardsSession >= 4) openers.push(trait('addict', 'FORTUNE COLLECTOR'));

  const voices = [
    IS_COARSE ? trait('phone', 'POCKET TRAVELER') : trait('desk', 'DESK WIZARD'),
    matchMedia('(prefers-color-scheme: dark)').matches ? trait('dark', 'DARK-MODE MYSTIC') : trait('light', 'SUNLIT SOUL'),
    Sound.started && Sound.on ? trait('listening', 'VOID LISTENER') : trait('silent', 'SILENT WATCHER'),
    trait(seasonKey(cal), seasonKey(cal) === 'transition' ? 'DOORWAY CHILD' : `${seasonKey(cal).toUpperCase()} CHILD`),
  ];
  const most = Math.max(...P.dwell);
  if (most > 20) {
    const fav = P.dwell.indexOf(most);
    voices.push(trait(`fav${fav}`, ['NEON HEART', 'QUEST HEART', 'GLAM HEART', 'SOFT HEART'][fav]));
  }

  const vars = {
    greet: greeting(h), pet: titleCase(pet.en), el: el.en.toLowerCase(),
    year: titleCase(yearName(cal)), yel: ELEMENTS[STEMS[cal.year.stem][2]].en.toLowerCase(),
    time: now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
    day: now.toLocaleDateString('en-US', { weekday: 'long' }),
    v: P.visits, gap: P.daysAway, n: P.warps, s: P.shakes, min: mins, c: P.cardsSession,
  };
  return { time: openers[0], openers, voices, vars, closerPrefix:
    { witching: 'Before you sleep', night: 'Before you sleep', dawn: 'Before noon', morning: 'Before noon',
      afternoon: 'Before sunset', evening: 'Before midnight' }[tk] };
}

// opener (who you seem to be) + bazi core + pet's voice + a tiny ritual.
// Every reading is checked against past readings on this device, so none repeat.
// Every reading opens with the calendar (day of the year, year pillar, solar term)
// and how the pet meets this year, then the visitor's vibe, the day's Ten God, and
// either the pet's voice or a tiny ritual.
function composeReading(pet, el, god, cal, yearRel) {
  const V = readVibe(pet, el, cal), seen = new Set(readLocal('relic.seen', []));
  const base = strHash(`${pet.id}|${cal.dayIdx}|${Persona.cardsSession}|${Date.now()}`);
  const pick = (list, r) => list[Math.floor(r * list.length)];
  const fill = s => s.replace(/\{(\w+)\}/g, (_, k) => V.vars[k] ?? '');
  const [, , termJp, termEn, termAdvice] = cal.term;
  const calendarLine = `Day ${cal.doy} of ${cal.gregorianYear}, the ${titleCase(yearName(cal))} year, in ${termJp} ${titleCase(termEn)}: ${termAdvice}.`;
  let reading;
  for (let v = 0; v < 60; v++) {
    const r = k => hash(base, v, k);
    const oT = pick(V.openers, r(1)), vT = pick(V.voices, r(2));
    const last = r(7) < 0.5 ? pick(VOICES[vT.key], r(5)) : `${V.closerPrefix}, ${pick(ACTIONS[ELEMENTS.indexOf(el)], r(6))}.`;
    const parts = [calendarLine, pick(YEAR_LINES[yearRel], r(8)), pick(OPENERS[oT.key], r(3)), pick(god.lines, r(4)), last];
    const text = parts.map(fill).map(capitalize).join(' ');
    const traits = [V.time, oT, vT].filter((tr, q, a) => a.findIndex(x => x.key === tr.key) === q);
    reading = { text, traits };
    if (!seen.has(strHash(text))) break;
  }
  writeLocal('relic.seen', [...seen, strHash(reading.text)].slice(-500));
  return reading;
}

// Sexagenary day index; 2000-01-01 was a 戊午 day (index 54).
function dayPillarIndex(date = new Date()) {
  const days = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(2000, 0, 1)) / 86400000);
  return ((54 + days) % 60 + 60) % 60;
}

// The Four Pillars (四柱) of this exact moment, plus solar term and day of the year.
function baziCalendar(date = new Date()) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate(), h = date.getHours();
  let term = 23;                                              // before 小寒: still last year's 冬至
  SOLAR_TERMS.forEach(([tm, td], q) => { if (m > tm || (m === tm && d >= td)) term = q; });

  const baziYear = y - (m < 2 || (m === 2 && d < 4) ? 1 : 0);  // the bazi year turns at 立春
  const yearIdx = ((baziYear - 1984) % 60 + 60) % 60;          // 1984 = 甲子
  const monthBranch = ((term - (term % 2)) / 2 + 1) % 12;      // 小寒 → 丑, 立春 → 寅, … 大雪 → 子
  const monthStem = ((yearIdx % 10) % 5 * 2 + 2 + (monthBranch + 10) % 12) % 10;
  const dayIdx = dayPillarIndex(h >= 23 ? new Date(y, m - 1, d + 1) : date);   // day turns at 子 hour (23:00)
  const hourBranch = Math.floor((h + 1) / 2) % 12;
  const hourStem = ((dayIdx % 10) % 5 * 2 + hourBranch) % 10;

  const doy = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 1)) / 86400000) + 1;
  const yearDays = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const pillar = (stem, branch) => ({ stem, branch, text: STEMS[stem][0] + BRANCHES[branch][0] });
  return {
    year: pillar(yearIdx % 10, yearIdx % 12), month: pillar(monthStem, monthBranch),
    day: pillar(dayIdx % 10, dayIdx % 12), hour: pillar(hourStem, hourBranch),
    dayIdx, term: SOLAR_TERMS[term], monthElement: BRANCH_ELEMENT[monthBranch],
    doy, yearDays, gregorianYear: y,
  };
}

function relation(pet, day) {              // how the pet's element meets today's day master
  if (pet === day) return 'companion';
  if ((pet + 1) % 5 === day) return 'resource';     // pet nourishes you
  if ((day + 1) % 5 === pet) return 'expression';   // you pour into the pet
  if ((day + 2) % 5 === pet) return 'wealth';       // you shape it
  return 'authority';                               // it shapes you
}

// How the pet's element meets the year's element: always part of the reading.
const YEAR_LINES = {
  companion:  ['You and the {year} year share the same {yel} blood, so move with its wave.',
               'The {year} year is your twin this year. Walk in step with it.'],
  resource:   ["{pet}'s {el} feeds the {year} year, so whatever you nurture now grows fast.",
               'You are fuel for the {year} year. Give generously and it comes back doubled.'],
  expression: ['The {year} year pours its {yel} into you, so accept the support.',
               'This {year} year is on your side, quietly refilling your cup.'],
  wealth:     ['The {year} year is clay in your hands. Shape it boldly.',
               'You hold the reins of this {year} year. Steer toward what you love.'],
  authority:  ['The {year} year sets the rules, so bend like bamboo and you win.',
               'The {year} year is a strict teacher, and you are its favourite student.'],
};
const LUCK_SCORE = { resource: 2, companion: 1, expression: 1, wealth: 0, authority: -1 };

function makeOracle(pet) {
  const cal = baziCalendar(), p = (pet.id * 13 + cal.dayIdx) % 60;          // the pet's pillar shifts daily
  const stem = STEMS[p % 10], branch = BRANCHES[p % 12], el = ELEMENTS[stem[2]];
  const dayRel = relation(stem[2], STEMS[cal.day.stem][2]);
  const yearRel = relation(stem[2], STEMS[cal.year.stem][2]);
  const score = LUCK_SCORE[dayRel] * 2 + LUCK_SCORE[yearRel];
  const luck = score >= 5 ? '大吉' : score >= 3 ? '中吉' : score >= 1 ? '吉' : score >= 0 ? '小吉' : '末吉';
  const god = TEN_GODS[dayRel];
  const world = WORLDS[pet.worldIndex ?? current().worldIndex];
  return {
    pet, stem, branch, el, god, luck, cal,
    reading: composeReading(pet, el, god, cal, yearRel),
    item: world.lucky[(pet.id + cal.dayIdx) % world.lucky.length],
  };
}

function yearName(cal) {                   // e.g. "丙午 FIRE HORSE"
  return `${cal.year.text} ${ELEMENTS[STEMS[cal.year.stem][2]].en} ${BRANCHES[cal.year.branch][1]}`;
}

function openOracle(pet) {
  Persona.noteCard();
  oracle = { card: makeOracle(pet), start: millis() };
  Sound.chime();
}

function drawOracle(F) {
  const c = oracle.card, el = c.el, a = Math.min(1, (millis() - oracle.start) / 450);
  const flip = Math.sin(a * Math.PI / 2);                     // card flips open
  const H = Math.min(height * 0.9, width * 0.94 / 0.62), W = H * 0.62;
  const ink = '#2a0018', gold = '#c9a227', paper = mix(el.color, '#ffffff', 0.62);
  const txt = (s, x, y, size, color, align = 'center') => {
    ctx.font = `${Math.round(size)}px ${FONT}`; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y);
  };

  ctx.fillStyle = `rgba(0,0,0,${0.5 * a})`;
  ctx.fillRect(0, 0, width, height);
  ctx.save();
  ctx.translate(width / 2, height / 2);
  ctx.scale(Math.max(0.02, flip), 1);
  ctx.translate(-W / 2, -H / 2);
  ctx.textBaseline = 'middle';

  // paper, tiled element watermark, double frame
  ctx.fillStyle = el.deep; ctx.fillRect(H * 0.015, H * 0.015, W, H);
  ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.1;
  const tile = H * 0.06;
  for (let y = tile; y < H; y += tile) for (let x = tile / 2; x < W; x += tile) txt(el.jp, x, y, tile * 0.7, el.deep);
  ctx.globalAlpha = 1;
  ctx.lineWidth = 3; ctx.strokeStyle = ink; ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
  ctx.lineWidth = 1; ctx.strokeStyle = gold;
  ctx.strokeRect(H * 0.02, H * 0.02, W - H * 0.04, H - H * 0.04);
  ctx.strokeRect(H * 0.028, H * 0.028, W - H * 0.056, H - H * 0.056);
  [0, 1, 2, 3].forEach(q => txt('✦', q & 1 ? W - H * 0.045 : H * 0.045, q & 2 ? H - H * 0.045 : H * 0.045, H * 0.03, gold));

  // header + the pet who delivered it
  txt('八字神諭 ✦ BAZI ORACLE', W / 2, H * 0.05, H * 0.024, ink);
  txt(`${c.pet.jp} · ${c.pet.en}`, W / 2, H * 0.088, H * 0.027, el.deep);
  const sp = SPRITES[c.pet.sprite], px = Math.max(2, Math.floor(H * 0.0075));
  const sx = Math.round(W / 2 - sp.w * px / 2), sy = Math.round(H * 0.168 - sp.h * px / 2 + (Math.floor(F.t * 2.2) & 1) * px);
  const spriteInk = { 1: mix(el.color, el.deep, 0.3), 2: mix(el.deep, '#e0218a', 0.35), 3: ink, 4: '#ffffff' };
  sp.rows.forEach((row, r) => Array.from(row).forEach((ch, q) => {
    if (ch !== '.') { ctx.fillStyle = spriteInk[ch]; ctx.fillRect(sx + q * px, sy + r * px, px, px); }
  }));

  // the pillar: heavenly stem over earthly branch, beside a hanko-style stamp
  const pillarX = W * 0.4;
  ctx.fillStyle = mix(paper, el.color, 0.5);
  ctx.fillRect(pillarX - H * 0.065, H * 0.245, H * 0.13, H * 0.18);
  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.strokeRect(pillarX - H * 0.065, H * 0.245, H * 0.13, H * 0.18);
  [[c.stem[0], 0.29], [c.branch[0], 0.38]].forEach(([ch, fy]) => {
    txt(ch, pillarX + H * 0.004, H * fy + H * 0.004, H * 0.075, el.color);
    txt(ch, pillarX, H * fy, H * 0.075, ink);
  });
  const stampX = W * 0.76, stampY = H * 0.335, stampR = H * 0.06;
  ctx.beginPath(); ctx.arc(stampX, stampY, stampR, 0, FULL_TURN);
  ctx.fillStyle = 'rgba(224,33,138,0.12)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#e0218a'; ctx.stroke();
  txt(c.luck, stampX, stampY, H * (c.luck.length > 1 ? 0.038 : 0.05), '#e0218a');

  // reading: pet pillar, ten god, the Four Pillars of this moment, what the portal senses, the message
  const cal = c.cal;
  txt(`${c.stem[1]} · ${c.branch[1]}  ${el.jp}${c.branch[2]}`, W / 2, H * 0.455, H * 0.022, el.deep);
  txt(`${c.god.jp}  ${c.god.en}`, W / 2, H * 0.49, H * 0.03, ink);
  txt(`此刻 年${cal.year.text} · 月${cal.month.text} · 日${cal.day.text} · 時${cal.hour.text}`, W / 2, H * 0.527, H * 0.02, el.deep);
  const vibe = wrapLines(`✧ I SEE: ${c.reading.traits.map(tr => tr.label).join(' · ')}`, W * 0.86, H * 0.018)[0];
  txt(vibe, W / 2, H * 0.556, H * 0.018, '#e0218a');

  let size = H * 0.024, lines;
  for (; size > H * 0.015; size -= H * 0.001) {                 // shrink to fit the message box
    lines = wrapLines(c.reading.text, W * 0.84, size);
    if (lines.length * size * 1.38 <= H * 0.25) break;
  }
  const top = H * 0.585 + size * 0.5;
  lines.forEach((line, q) => txt(line, W / 2, top + q * size * 1.38, size, ink));

  // lucky charms
  [['COLOR', el.lucky], ['DIRECTION', el.dir], ['NUMBERS', el.nums], ['ITEM', c.item.toUpperCase()]].forEach(([k, v], q) => {
    const y = H * (0.855 + q * 0.024);
    txt(k, W * 0.12, y, H * 0.018, el.deep, 'left');
    txt(v, W * 0.88, y, H * 0.018, ink, 'right');
  });
  ctx.fillStyle = el.color; ctx.fillRect(W * 0.12 + H * 0.072, H * 0.855 - H * 0.008, H * 0.016, H * 0.016);

  txt(`DAY ${cal.doy}/${cal.yearDays} · ${cal.gregorianYear} · ${cal.term[2]} ✦ TAP TO CLOSE`, W / 2, H * 0.962, H * 0.019, el.deep);
  ctx.restore();
}

function wrapLines(text, maxW, size) {
  ctx.font = `${Math.round(size)}px ${FONT}`;
  const lines = [''];
  text.split(' ').forEach(word => {
    const last = lines[lines.length - 1], tryLine = last ? `${last} ${word}` : word;
    if (ctx.measureText(tryLine).width > maxW && last) lines.push(word);
    else lines[lines.length - 1] = tryLine;
  });
  return lines;
}

// Roots blocked anywhere (spaces and symbols removed first), and words blocked when standalone.
const BAD_ROOTS = [
  'fuck', 'shit', 'cunt', 'nigg', 'niga', 'bitch', 'whore', 'slut', 'fagg', 'retard', 'pussy', 'dildo', 'porn',
  'wank', 'motherf', 'bollock', 'twat', 'cabron', 'pendej', 'puta', 'verga', 'chinga', 'mierda', 'culero',
  'maricon', 'joder', 'gilipoll', 'putain', 'merde', 'salope', 'connard', 'caralho', 'porra', 'scheiss',
  'arschloch', '傻逼', '煞笔', '操你', '他妈', '妈的', '草泥马', '婊子', '贱人', '去死', '死ね', '殺す',
  'ころす', 'くそ', 'クソ', 'ちんこ', 'まんこ', 'きもい', 'うざい', '씨발', '병신',
];
const BAD_WORDS = [
  'ass', 'arse', 'dick', 'cock', 'rape', 'fag', 'nazi', 'hitler', 'kys', 'cum', 'tits', 'boobs', 'sex', 'kill',
  'nsfw', 'idiot', 'stupid', 'dumb', 'ugly', 'loser', 'perra', 'zorra', 'idiota', 'estupido', 'estupida',
  'pene', 'polla', 'cono', 'tonto', 'tonta', 'baka', 'バカ', 'ばか',
];
const LEET = { 0: 'o', 1: 'i', '!': 'i', '|': 'i', 3: 'e', 4: 'a', '@': 'a', 5: 's', $: 's', 7: 't', '+': 't', 8: 'b' };

function checkMessage(raw) {
  const text = String(raw).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim();
  if (text.length < 2) return { ok: false, reason: 'write a little more ♡' };
  if (text.length > GUESTBOOK.maxLen) return { ok: false, reason: `max ${GUESTBOOK.maxLen} characters ✦` };
  if (/https?:|www\.|\.(com|net|org|io|ly|xyz|gg|me)\b|@\w+\./i.test(text) || /\d[\d\s\-().]{6,}\d/.test(text)) {
    return { ok: false, reason: 'no links, emails or numbers please ☆' };
  }
  const plain = text.normalize('NFKD').replace(/[̀-ͯ]/g, '').normalize('NFC').toLowerCase()
    .replace(/[01!|3@4$57+8]/g, ch => LEET[ch] || ch);
  const squashed = plain.replace(/[^\p{L}]/gu, '');
  const collapsed = squashed.replace(/(.)\1+/g, '$1');
  const tokens = plain.split(/[^\p{L}]+/u).filter(Boolean);
  const hitRoot = BAD_ROOTS.some(r => squashed.includes(r) || (r === r.replace(/(.)\1+/g, '$1') && collapsed.includes(r)));
  const hitWord = tokens.some(tk => BAD_WORDS.includes(tk) || BAD_WORDS.includes(tk.replace(/(.)\1+/g, '$1')));
  if (hitRoot || hitWord) return { ok: false, reason: '(｡•́︿•̀｡) the portal only accepts kind words' };
  return { ok: true, text };
}

const Wall = {
  list: STARTER_MESSAGES.slice(),
  shared: Boolean(GUESTBOOK.url && GUESTBOOK.anonKey),
  lastPost: 0,

  headers() {
    return { apikey: GUESTBOOK.anonKey, Authorization: `Bearer ${GUESTBOOK.anonKey}`, 'Content-Type': 'application/json' };
  },
  async load() {
    let msgs = [];
    if (this.shared) {
      try {
        const r = await fetch(`${GUESTBOOK.url}/rest/v1/${GUESTBOOK.table}?select=text&order=created_at.desc&limit=${GUESTBOOK.keep}`,
                              { headers: this.headers() });
        if (r.ok) msgs = (await r.json()).map(m => m.text);
      } catch (e) { /* offline: keep what we have */ }
    } else {
      msgs = readLocal('relic.wall', []);
    }
    msgs = msgs.filter(m => typeof m === 'string' && checkMessage(m).ok);   // re-check everything we display
    if (msgs.length) this.list = msgs;
  },
  async post(text) {
    if (this.shared) {
      const r = await fetch(`${GUESTBOOK.url}/rest/v1/${GUESTBOOK.table}`, {
        method: 'POST', headers: { ...this.headers(), Prefer: 'return=minimal' }, body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error(`post failed: ${r.status}`);
    } else {
      writeLocal('relic.wall', [text, ...readLocal('relic.wall', [])].slice(0, GUESTBOOK.keep));
    }
    this.list = [text, ...this.list].slice(0, GUESTBOOK.keep);
  },
};

function setupWall() {
  const form = document.querySelector('#wall form'), input = document.getElementById('wall-input');
  const status = document.getElementById('wall-status');
  document.getElementById('wall-note').textContent = Wall.shared
    ? 'everyone who visits will see your message ✦'
    : 'local mode: messages stay on this device until a database is connected';
  document.getElementById('wall-close').addEventListener('click', closeWall);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const res = checkMessage(input.value);
    if (!res.ok) { status.textContent = res.reason; return; }
    if (Date.now() - Wall.lastPost < GUESTBOOK.cooldownMs) { status.textContent = 'the wall needs a tiny nap, try again soon ♡'; return; }
    status.textContent = 'sending ♡…';
    try {
      await Wall.post(res.text);
      Wall.lastPost = Date.now();
      input.value = '';
      status.textContent = Wall.shared ? 'posted! everyone can see it now ✦' : 'saved on the wall ✦';
      Sound.chime();
      setTimeout(closeWall, 1100);
    } catch (err) {
      status.textContent = 'the void ate it (network error), try again?';
    }
  });
  Wall.load();
  if (Wall.shared) setInterval(() => Wall.load(), GUESTBOOK.pollMs);
}

function openWall() {
  document.getElementById('wall').hidden = false;
  document.getElementById('wall-status').textContent = '';
  document.getElementById('wall-input').focus();
}
function closeWall() { document.getElementById('wall').hidden = true; }
const wallOpen = () => !document.getElementById('wall').hidden;

function drawWall(F) {                      // ticker lanes drifting behind the pets
  const list = Wall.list, P = F.d.pal;
  if (!list.length) return;
  const size = Math.max(13, Math.round(cell * 1.3));
  const lanes = Math.max(1, Math.min(4, list.length, Math.floor(height / (size * 5))));
  ctx.font = `${size}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.28);
  for (let l = 0; l < lanes; l++) {
    const msgs = list.filter((_, q) => q % lanes === l);
    const text = msgs.map(m => `✉ ${m}`).join('    ✦    ') + '    ✦    ';
    const w = ctx.measureText(text).width, dir = l & 1 ? 1 : -1, speed = size * (1.4 + (l % 3) * 0.6);
    const y = height * (0.2 + 0.6 * (l + 0.5) / lanes);
    for (let x = ((F.t * speed * dir) % w + w) % w - w; x < width; x += w) {
      ctx.strokeStyle = P[0]; ctx.strokeText(text, x, y);
      ctx.fillStyle = P[1 + (l % (F.d.n - 1))]; ctx.fillText(text, x, y);
    }
  }
}


/* ---------- 7f. MINI-GAME: FORTUNE CARDS (占) ------------------------- */
// Three face-down cards shuffle; pick one and the pet hiding on it reads your fortune.

let fortune = null;

function openFortune() {
  oracle = null;
  const pool = shuffle(PETS.slice()).slice(0, 3);
  if (customPet && Math.random() < 0.5) pool[Math.floor(Math.random() * 3)] = customPet;   // your pet may be hiding here
  const swaps = Array.from({ length: 6 }, () => shuffle([0, 1, 2]).slice(0, 2));
  fortune = { start: millis(), pets: pool, swaps, slots: [0, 1, 2] };
  Sound.chime();
}

function fortuneLayout() {
  const ch = Math.min(height * 0.42, (width * 0.9 / 3.4) / 0.62), cw = ch * 0.62;
  return { cw, ch, gap: cw * 1.2, y: height * 0.5 };
}

// Card k's slot (possibly between two slots) at time `el` seconds into the shuffle.
function fortuneSlot(k, el) {
  const swapDur = 0.28, n = Math.min(fortune.swaps.length, Math.floor(el / swapDur));
  const slots = [0, 1, 2];
  for (let s = 0; s < n; s++) { const [a, b] = fortune.swaps[s]; [slots[a], slots[b]] = [slots[b], slots[a]]; }
  if (n >= fortune.swaps.length) return { x: slots[k], lift: 0, done: true, slots };
  const [a, b] = fortune.swaps[n], p = (el - n * swapDur) / swapDur, e = p * p * (3 - 2 * p);
  const next = slots.slice(); [next[a], next[b]] = [next[b], next[a]];
  const moving = k === a || k === b;
  return { x: slots[k] + (next[k] - slots[k]) * e, lift: moving ? Math.sin(e * Math.PI) * (k === a ? 1 : -1) : 0, done: false, slots };
}

function drawFortune(F) {
  const { cw, ch, gap, y } = fortuneLayout(), el = (millis() - fortune.start) / 1000;
  ctx.fillStyle = 'rgba(10,0,20,0.6)';
  ctx.fillRect(0, 0, width, height);
  let done = false;
  fortune.pets.forEach((pet, k) => {
    const s = fortuneSlot(k, el);
    done = s.done;
    const cx = width / 2 + (s.x - 1) * gap, cy = y - s.lift * ch * 0.25 + (s.done ? Math.sin(F.t * 3 + k) * ch * 0.02 : 0);
    fortune.slots = s.slots;
    drawCardBack(cx - cw / 2, cy - ch / 2, cw, ch, F.t + k);
  });
  const size = Math.max(14, Math.round(cell * 1.4));
  ctx.textBaseline = 'top';
  label(done ? 'PICK YOUR CARD ✦ 選んでね' : 'SHUFFLING DESTINY… 洗牌中', width / 2, y + ch * 0.62, size, 'center', F.d.pal);
  label('八字 FORTUNE GAME', width / 2, y - ch * 0.62 - size * 3, size, 'center', F.d.pal);
  const cal = baziCalendar();                // the moment you're drawing in
  label(`${cal.gregorianYear} ${yearName(cal)} · DAY ${cal.doy} · ${cal.term[2]} ${cal.term[3]}`,
        width / 2, y - ch * 0.62 - size * 1.5, Math.round(size * 0.75), 'center', F.d.pal);
  fortune.ready = done;
}

function drawCardBack(x, y, w, h, t) {
  const gold = '#c9a227';
  ctx.fillStyle = '#ff4fd8'; ctx.fillRect(x + w * 0.05, y + w * 0.05, w, h);
  ctx.fillStyle = '#2a0018'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = gold; ctx.lineWidth = 2;
  ctx.strokeRect(x + w * 0.06, y + w * 0.06, w - w * 0.12, h - w * 0.12);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ring = ELEMENTS.map(e => e.jp);
  ring.forEach((c, q) => {
    const a = t * 0.8 + q / ring.length * FULL_TURN;
    ctx.font = `${Math.round(w * 0.14)}px ${FONT}`;
    ctx.fillStyle = ELEMENTS[q].color;
    ctx.fillText(c, x + w / 2 + Math.cos(a) * w * 0.3, y + h / 2 + Math.sin(a) * w * 0.3);
  });
  ctx.font = `${Math.round(w * 0.2)}px ${FONT}`; ctx.fillStyle = gold;
  ctx.fillText('八字', x + w / 2, y + h / 2);
  ctx.font = `${Math.round(w * 0.1)}px ${FONT}`;
  ctx.fillText('✦', x + w * 0.16, y + w * 0.16); ctx.fillText('✦', x + w * 0.84, y + h - w * 0.16);
}

function fortuneTap(x, y) {                // returns true if the tap was used by the game
  if (!fortune.ready) return true;
  const { cw, ch, gap, y: cy } = fortuneLayout();
  const k = fortune.pets.findIndex((_, q) => {
    const cx = width / 2 + (fortune.slots[q] - 1) * gap;
    return Math.abs(x - cx) < cw / 2 && Math.abs(y - cy) < ch / 2;
  });
  const pet = k >= 0 ? fortune.pets[k] : null;
  fortune = null;
  if (pet) openOracle(pet);
  return true;
}

// Build your own pet from parts; it follows you through every scene.

const STUDIO_COLORS = [
  ['BUBBLEGUM', '#ff9ad5'], ['LILAC', '#c9a7ff'], ['MINT', '#9ff0c8'], ['LEMON', '#fff38a'],
  ['SKY', '#9fd8ff'], ['PEACH', '#ffc29f'], ['CHROME', '#e4e4f2'], ['NEON', '#39ff14'],
];
const STUDIO_PARTS = [
  ['BODY',  Object.keys(BODIES)],
  ['EYES',  Object.keys(EYE_PAIRS)],
  ['MOUTH', Object.keys(MOUTHS)],
  ['HAT',   ['-', ...Object.keys(HATS)]],
  ['COLOR', STUDIO_COLORS.map(c => c[0])],
  ['BLUSH', ['on', 'off']],
];
let customPet = null;
const studio = { pick: [0, 0, 0, 0, 0, 0] };

function petColors(hex) {                  // sticker palette for a custom pet
  const ink = '#2a0018', accent = mix(hex, ink, 0.35);
  return {
    pet:    { 1: hex, 2: accent, 3: ink, 4: '#ffffff', 5: '#ffffff', 6: '#1a0010', 7: ink },
    petInk: { 1: mix(hex, ink, 0.25), 2: mix(accent, ink, 0.35), 3: '#5a3050', 4: mix('#ffffff', accent, 0.35),
              5: mix('#ffffff', accent, 0.45), 6: '#3a2030' },
  };
}

function studioSpec() {
  const v = STUDIO_PARTS.map(([, opts], q) => opts[studio.pick[q]]);
  return { spec: `${v[0]} ${v[1]} ${v[2]} ${v[3]}${v[5] === 'on' ? ' blush' : ''}`, color: STUDIO_COLORS[studio.pick[4]][1] };
}

function adoptPet(saved) {
  registerSprite('custom', composePet(saved.spec));
  customPet = { id: 900, en: saved.name.toUpperCase(), jp: 'あなたのペット', sprite: 'custom', colors: petColors(saved.color) };
}

function setupStudio() {
  const opts = document.getElementById('studio-opts'), form = document.querySelector('#studio form');
  const status = document.getElementById('studio-status'), name = document.getElementById('studio-name');
  STUDIO_PARTS.forEach(([title, list], q) => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = `<span>${title}</span><button type="button">◀</button><span class="val"></span><button type="button">▶</button>`;
    const [prev, next] = row.querySelectorAll('button');
    prev.onclick = () => { studio.pick[q] = (studio.pick[q] + list.length - 1) % list.length; renderStudio(); };
    next.onclick = () => { studio.pick[q] = (studio.pick[q] + 1) % list.length; renderStudio(); };
    opts.appendChild(row);
  });
  document.getElementById('studio-random').onclick = () => {
    studio.pick = STUDIO_PARTS.map(([, list]) => Math.floor(Math.random() * list.length));
    renderStudio();
  };
  document.getElementById('studio-close').onclick = closeStudio;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const check = checkMessage(name.value || 'mochi');
    if (!check.ok || check.text.length > 14) { status.textContent = check.ok ? 'max 14 characters ✦' : check.reason; return; }
    const saved = { ...studioSpec(), name: check.text, pick: studio.pick };
    writeLocal('relic.custom', saved);
    adoptPet(saved);
    status.textContent = `${check.text} joined you ♥`;
    Sound.chime();
    setTimeout(closeStudio, 900);
  });

  const saved = readLocal('relic.custom', null);
  if (saved && saved.spec) {
    try { adoptPet(saved); studio.pick = saved.pick || studio.pick; name.value = saved.name; } catch (e) { /* stale save */ }
  } else {
    studio.pick = STUDIO_PARTS.map(([, list]) => Math.floor(Math.random() * list.length));
  }
}

function renderStudio() {
  document.querySelectorAll('#studio-opts .val').forEach((el, q) => {
    el.textContent = STUDIO_PARTS[q][1][studio.pick[q]].toUpperCase().replace('-', 'NONE');
  });
  const { spec, color } = studioSpec(), rows = composePet(spec), colors = petColors(color).pet;
  const cv = document.getElementById('studio-preview'), g = cv.getContext('2d');
  const px = Math.floor(Math.min(cv.width / 14, cv.height / (rows.length + 2)));
  const ox = Math.round((cv.width - 12 * px) / 2), oy = Math.round((cv.height - rows.length * px) / 2);
  g.fillStyle = '#ffd1ec'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#ffe6f4';
  for (let y = 0; y < cv.height; y += px * 2) for (let x = (y / px / 2) % 2 ? px * 2 : 0; x < cv.width; x += px * 4) g.fillRect(x, y, px * 2, px * 2);
  rows.forEach((row, r) => Array.from(row).forEach((ch, q) => {
    if (ch !== '.') { g.fillStyle = colors[ch]; g.fillRect(ox + q * px, oy + r * px, px, px); }
  }));
}

function openStudio() { document.getElementById('studio').hidden = false; renderStudio(); }
function closeStudio() { document.getElementById('studio').hidden = true; }
const panelOpen = () => wallOpen() || !document.getElementById('studio').hidden;
