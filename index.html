function drawHUD(F) {
  const { sc, d, t } = F, P = d.pal;
  const hs = Math.max(12, Math.round(cell * 1.15)), ss = Math.max(10, Math.round(hs * 0.72));
  const m = Math.max(14, Math.round(cell * 1.2));
  ctx.textBaseline = 'top';

  // chic double hairline frame
  ctx.lineWidth = 1; ctx.strokeStyle = P[1];
  for (const [inset, alpha] of [[0.4, 1], [0.6, 0.45]]) {
    const o = Math.round(m * inset);
    ctx.globalAlpha = alpha;
    ctx.strokeRect(o + 0.5, o + 0.5, width - 2 * o - 1, height - 2 * o - 1);
  }
  ctx.globalAlpha = 1;

  titleBlock(P, d, t, m, hs, ss, F.virus ? (frameCount & 4 ? '萌ウイルス' : '感染中♡♡') : TITLE_JP);
  label(`№ ${String(sc.id + 1).padStart(3, '0')} / ${SCENES.length}`, width - m, m, hs, 'right', P);
  label(`${sc.world.jp} · ${sc.world.en}`, width - m, m + hs * 1.6, ss, 'right', P);
  drawMenu(F, m, m + hs * 1.6 + ss * 2.4);

  const style = `${sc.style.toUpperCase()} MODE · ${sc.bpm} BPM`, bottom = height - m - ss;
  if (width < height) {                    // portrait phone: centred stack
    const cxp = width / 2;
    label(hintText(), cxp, bottom, ss, 'center', P);
    label(style, cxp, bottom - ss * 1.8, ss, 'center', P);
    label(sc.name, cxp, bottom - ss * 3.6, ss, 'center', P);
    label(sc.cjk, cxp, bottom - ss * 3.6 - hs * 1.7, hs, 'center', P);
  } else {
    label(sc.name, m, bottom, ss, 'left', P);
    label(sc.cjk, m, bottom - hs * 1.7, hs, 'left', P);
    label(hintText(), width - m, bottom, ss, 'right', P);
    label(style, width - m, bottom - ss * 1.8, ss, 'right', P);
  }
}

// Mini-game menu: chunky sticker buttons that bob, and take turns sparkling.
function drawMenu(F, m, top) {
  const t = F.t, ink = VIRUS.ink, size = Math.max(14, Math.round(cell * 1.35));
  const items = [
    ['占', 'FORTUNE GAME', '#fff200', openFortune],
    ['✉', 'MESSAGE WALL', '#7dfcff', openWall],
    ['✂', 'DRESS-UP PET', '#ff9ad5', openStudio],
    ['♪', Sound.started && Sound.on ? 'SOUND ON' : 'SOUND OFF', '#b8ff5c', () => (Sound.started ? Sound.toggle() : Sound.start())],
  ];
  ctx.font = `${size}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const h = Math.round(size * 2), iconW = h, gap = Math.round(size * 0.55);
  const w = Math.max(...items.map(it => ctx.measureText(it[1]).width)) + iconW + size * 1.2;
  const x = width - m - w, shadow = Math.max(3, Math.round(size * 0.25));
  const spotlight = Math.floor(t / 1.6) % 3;             // the three games take turns sparkling

  label('MINI GAMES ✦ 遊戯', width - m, top, Math.max(10, Math.round(size * 0.7)), 'right', F.d.pal);
  menu = items.map(([icon, text, color, action], q) => {
    const y = Math.round(top + size * 1.5 + q * (h + gap) + Math.sin(t * 2.5 + q * 1.3) * size * 0.1);
    ctx.fillStyle = ink; ctx.fillRect(x + shadow, y + shadow, w, h);                  // drop shadow
    ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = ink; ctx.fillRect(x, y, iconW, h);                                // icon tile
    ctx.lineWidth = 2; ctx.strokeStyle = ink; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    if (q === spotlight) {                                                            // sparkle outline
      ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
      ctx.font = `${Math.round(size * 0.8)}px ${FONT}`; ctx.fillStyle = '#ffffff';
      ctx.fillText('✦', x - size * 0.9, y + h / 2 + Math.sin(t * 8) * size * 0.15);
    }
    ctx.font = `${Math.round(size * 1.1)}px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillStyle = color; ctx.fillText(icon, x + iconW / 2, y + h / 2);
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillStyle = ink; ctx.fillText(text, x + iconW + size * 0.6, y + h / 2);
    return { action, rect: { x, y, w, h } };
  });
  ctx.textBaseline = 'top';
}

function titleBlock(P, d, t, m, hs, ss, title) {  // acid strobe title, one colour per character
  const ts = Math.round(hs * 1.7);
  ctx.font = `${ts}px ${FONT}`; ctx.textAlign = 'left';
  plate(m, m, ctx.measureText(title).width, ts, P[0]);
  let x = m;
  Array.from(title).forEach((ch, q) => {
    ctx.fillStyle = P[2]; ctx.fillText(ch, x + ts * 0.06, m + ts * 0.06);
    ctx.fillStyle = P[1 + (q + Math.floor(t * 4)) % (d.n - 1)]; ctx.fillText(ch, x, m);
    x += ctx.measureText(ch).width;
  });
  label(TITLE_EN, m, m + ts * 1.3, ss, 'left', P);
}

function label(txt, x, y, size, align, P) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  const w = ctx.measureText(txt).width;
  const left = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  plate(left, y, w, size, P[0]);
  const o = Math.max(1, Math.round(size * 0.07));
  ctx.fillStyle = P[2]; ctx.fillText(txt, x + o, y + o);
  ctx.fillStyle = P[1]; ctx.fillText(txt, x, y);
  return { x: left - size * 0.35, y: y - size * 0.2, w: w + size * 0.7, h: size * 1.4 };
}

function plate(x, y, w, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - size * 0.35, y - size * 0.2, w + size * 0.7, size * 1.4);
}

function hintText() {
  const how = IS_COARSE ? 'TAP' : 'CLICK';
  return `${how} ANYWHERE TO WARP ✦ 占 FORTUNE GAME FOR READINGS`;
}


/* ---------- 9. P5 LIFECYCLE & INPUT ---------------------------------- */

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.elt.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('touchend', unlock, { passive: true });
  window.addEventListener('click', unlock);
  window.addEventListener('keydown', unlock);
  window.addEventListener('devicemotion', onMotion);
  document.addEventListener('visibilitychange', () => Sound.pause(document.hidden));

  pixelDensity(1);                        // chunky pixels, upscaled crisply by CSS
  frameRate(CFG.fps);
  ctx = drawingContext;
  makeScanlines();
  buildLayout();
  Persona.load();
  setupWall();
  setupStudio();
  order = buildOrder();
  prevD = prepare(current());
  nextVirus = millis() + random(VIRUS.minGapMs, VIRUS.maxGapMs);
}

function draw() {
  const t = millis() / 1000, sc = current();
  trans = Math.max(0, trans - deltaTime / CFG.transitionMs);
  Persona.dwell[sc.worldIndex] += deltaTime / 1000;
  const V = updateVirus(millis());
  updatePopups(millis());
  const d = V && V.types.has('negative') && (frameCount & 2) ? negativeD(sc) : sc.d;
  const rot = 0.18 * Math.sin(t * 0.11);
  const F = {
    t, sc, d, rot, virus: V, pat: PATTERNS[sc.pattern],
    cr: Math.cos(rot), sr: Math.sin(rot), zoom: 1 + 0.12 * Math.sin(t * 0.23),
  };
  lastPets = petStates(t, sc);
  if (V) lastPets[lastPets.length - 1].i0 += Math.round(Math.sin(t * 50));   // the infected pet shivers
  buildPetLayer(lastPets);

  // per-row tears (warp glitch + tiny random ones) and per-column melt (virus)
  const tearSeed = frameCount >> 1;
  for (let j = 0; j < L.rows; j++) {
    const tearing = trans > 0 && hash(j, tearSeed, 1) < trans * 0.5;
    const micro = hash(j, frameCount >> 2, 5) < 0.006;
    L.tear[j] = tearing ? Math.round((hash(j, tearSeed, 2) - 0.5) * trans * cell * 8)
              : micro   ? Math.round((hash(j, frameCount, 6) - 0.5) * cell * 3) : 0;
  }
  const meltAmp = V && V.types.has('melt') ? Math.sin(V.p * Math.PI) * cell * 7 : 0;
  for (let i = 0; i < L.cols; i++) L.melt[i] = meltAmp ? Math.round(hash(i, V.seed) * meltAmp) : 0;

  ctx.fillStyle = d.pal[0];
  ctx.fillRect(0, 0, width, height);
  const cellFont = `${Math.round(cell * 0.95)}px ${FONT}`;
  const eachCell = (wantPet, paint) => {
    ctx.font = cellFont; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let j = 0; j < L.rows; j++) for (let i = 0; i < L.cols; i++) {
      const k = j * L.cols + i;
      if ((L.code[k] !== 0) === wantPet) paint(k, i, j, i * cell + L.tear[j], j * cell + L.melt[i], F);
    }
  };

  eachCell(false, backgroundCell);        // 1. psychedelic background
  drawWall(F);                            // 2. visitors' messages
  eachCell(true, petCell);                // 3. the pets, on top
  drawEmote(F, lastPets[lastPets.length - 1]);
  drawNameTag(F);
  drawHUD(F);
  drawPopups(F);
  if (fortune) drawFortune(F);
  if (oracle) drawOracle(F);
  ctx.fillStyle = scanlines;
  ctx.fillRect(0, 0, width, height);
  if (trans > 0.6) {                      // brief colour flash on warp
    ctx.globalAlpha = (trans - 0.6) * 1.2;
    ctx.fillStyle = d.pal[1];
    ctx.fillRect(0, 0, width, height);
    ctx.globalAlpha = 1;
  }
}

function warp(source = 'tap') {
  const now = millis();
  if (now - lastWarp < 300) return;
  lastWarp = now;
  Persona.noteWarp(source);
  oracle = null;
  fortune = null;
  prevD = current().d;
  sceneCursor = (sceneCursor + 1) % order.length;
  prepare(current());
  trans = 1;
  Sound.setScene(current(), true);
}

// Round-robin across worlds so consecutive scenes feel different.
function buildOrder() {
  const perWorld = WORLDS.map((_, w) => shuffle(SCENES.filter(s => s.worldIndex === w).map(s => s.id)));
  const out = [], longest = Math.max(...perWorld.map(list => list.length));
  for (let n = 0; n < longest; n++) {
    shuffle(WORLDS.map((_, w) => w)).forEach(w => { if (n < perWorld[w].length) out.push(perWorld[w][n]); });
  }
  return out;
}

function makeScanlines() {
  const c = document.createElement('canvas');
  c.width = 1; c.height = 3;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.22)';
  g.fillRect(0, 2, 1, 1);
  scanlines = ctx.createPattern(c, 'repeat');
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  buildLayout();
}

// Pointer events treat mouse clicks and finger taps the same way.
function onPointerDown(e) {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  const item = menu.find(it => hitRect(x, y, it.rect, 8));
  if (item) { if (item.rect !== menu[menu.length - 1].rect) unlock(); item.action(); return; }
  unlock();
  if (fortune) { fortuneTap(x, y); return; }          // fortune game in progress
  if (oracle) { oracle = null; return; }              // any tap closes the card
  if (popupTap(x, y)) return;                         // tap a pop-up to close it
  warp(e.pointerType === 'mouse' ? 'click' : 'tap');  // tap anywhere else (pets too) → new scene
}

// iOS only grants motion + audio from touchend / click / keydown gestures.
function unlock() { askMotion(); Sound.start(); }

function hitRect(x, y, r, pad) {
  return x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad;
}

function keyPressed() {
  if (panelOpen()) { if (keyCode === ESCAPE) { closeWall(); closeStudio(); } return; }   // typing in a panel
  if (keyCode === ESCAPE) { fortune = null; oracle = null; return; }
  if (key === 'g' || key === 'G') openFortune();
  if (key === 'w' || key === 'W') openWall();
  if (key === 'd' || key === 'D') openStudio();
  if (key === 'f' || key === 'F') fullscreen(!fullscreen());
  if (key === 'm' || key === 'M') { if (!Sound.started) Sound.start(); else Sound.toggle(); }
}

function askMotion() {
  if (!CFG.shakeToWarp || motionAsked || !NEEDS_MOTION_PERMISSION) return;
  motionAsked = true;
  DeviceMotionEvent.requestPermission()
    .then(state => { motionGranted = state === 'granted'; })
    .catch(() => { motionAsked = false; });
}

function onMotion(e) {
  if (!CFG.shakeToWarp) return;
  const a = e.acceleration, g = e.accelerationIncludingGravity;
  let force = 0;
  if (a && a.x !== null) force = Math.hypot(a.x, a.y, a.z);
  else if (g && g.x !== null) force = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81);
  if (force > CFG.shakeForce && millis() - lastShake > CFG.shakeCooldownMs && !panelOpen() && !fortune) {
    lastShake = millis();
    warp('shake');
  }
}


/* ---------- 10. VOID PORTAL SOUND (Web Audio, no extra libraries) ---- */
// Drone + drifting pads + echoing glass plinks + a soft heartbeat, all in a
// huge reverb, over flowing water and random droplets / bubbles.

const WORLD_ROOTS = [57, 50, 53, 48];                   // MIDI roots per world: A, D, F, C
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17];
const PROGRESSION = [[0, 'min'], [-4, 'maj'], [3, 'maj'], [-2, 'maj']];
const CHORD = { min: [0, 3, 7, 14], maj: [0, 4, 7, 14] };
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

const Sound = {
  on: true, started: false, ac: null,
  root: 57, bpm: 120, step: 0, next: 0, nextDrop: 0, chordIdx: 0,

  start() {
    if (this.started) { if (this.on && this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.started = true;
    const ac = this.ac = new AC();
    ac.resume();

    this.master = ac.createGain();
    this.master.gain.value = 0;
    this.master.connect(ac.destination);
    this.master.gain.setTargetAtTime(this.on ? 0.8 : 0, ac.currentTime, 1.2);

    this.verb = ac.createConvolver();                   // the void
    this.verb.buffer = impulse(ac, 6, 2.2);
    const wet = ac.createGain(); wet.gain.value = 0.7;
    this.verb.connect(wet).connect(this.master);

    this.echo = ac.createDelay(2);                      // dripping echo
    this.echo.delayTime.value = 0.42;
    const fb = ac.createGain(); fb.gain.value = 0.42;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2200;
    this.echo.connect(tone).connect(fb).connect(this.echo);
    tone.connect(this.master); tone.connect(this.verb);

    this.noise = noiseBuffer(ac, 4);
    this.buildDrone(); this.buildPad(); this.buildWater();
    this.next = ac.currentTime + 0.1;
    this.nextDrop = ac.currentTime + 0.5;
    this.setScene(current(), false);
    setInterval(() => this.schedule(), 50);
  },

  toggle() {
    this.on = !this.on;
    if (this.on) this.ac.resume();
    this.master.gain.setTargetAtTime(this.on ? 0.8 : 0, this.ac.currentTime, 0.25);
  },

  pause(hidden) {
    if (!this.started) return;
    if (hidden) this.ac.suspend(); else if (this.on) this.ac.resume();
  },

  // route a node to dry / reverb / echo with the given amounts
  send(node, dry, wet, echo = 0) {
    [[this.master, dry], [this.verb, wet], [this.echo, echo]].forEach(([dest, amt]) => {
      if (amt <= 0) return;
      const g = this.ac.createGain(); g.gain.value = amt;
      node.connect(g).connect(dest);
    });
  },

  buildDrone() {
    const ac = this.ac, lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 5;
    lfo(ac, 0.045, 180, lp.frequency);
    const bus = ac.createGain(); bus.gain.value = 0.16;
    lp.connect(bus); this.send(bus, 1, 0.6);
    this.drone = [[-24, 'sawtooth', 0], [-24, 'sine', 7], [-17, 'triangle', -5]].map(([semi, type, cents]) => {
      const o = ac.createOscillator(); o.type = type; o.detune.value = cents; o.connect(lp); o.start();
      return { o, semi };
    });
  },

  buildPad() {
    const ac = this.ac, lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    lfo(ac, 0.07, 500, lp.frequency);
    const bus = ac.createGain(); bus.gain.value = 0.045;
    lp.connect(bus); this.send(bus, 1, 1.2);
    this.pad = [0, 1, 2, 3].map(q => {
      const o = ac.createOscillator(); o.type = 'triangle'; o.detune.value = (q - 1.5) * 6; o.connect(lp); o.start();
      return o;
    });
  },

  buildWater() {                                        // a stream + a high trickle
    const ac = this.ac;
    [[900, 0.6, 0.05, 0.17, 0], [3200, 4, 0.012, 3.1, 1.7]].forEach(([freq, q, vol, rate, offset]) => {
      const src = ac.createBufferSource(); src.buffer = this.noise; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
      lfo(ac, 0.11, freq * 0.4, bp.frequency);
      const g = ac.createGain(); g.gain.value = vol;
      lfo(ac, rate, vol * 0.6, g.gain);
      src.connect(bp).connect(g); this.send(g, 1, 0.5);
      src.start(0, offset);
    });
  },

  setScene(sc, fx) {
    if (!this.started) return;
    const now = this.ac.currentTime;
    this.root = WORLD_ROOTS[sc.worldIndex] + [0, 2, -3][sc.id % 3];
    this.bpm = sc.bpm;
    this.drone.forEach(({ o, semi }) => o.frequency.setTargetAtTime(hz(this.root + semi), now, fx ? 0.6 : 0.01));
    this.setChord(this.chordIdx, now, fx ? 0.8 : 0.01);
    if (fx) this.whoosh(now);
  },

  setChord(idx, when, glide = 0.8) {
    this.chordIdx = idx;
    const [off, quality] = PROGRESSION[idx];
    CHORD[quality].forEach((iv, v) => this.pad[v].frequency.setTargetAtTime(hz(this.root + off + iv), when, glide));
  },

  schedule() {
    const ac = this.ac;
    if (ac.state !== 'running') return;
    const now = ac.currentTime, ahead = now + 0.25, stepDur = 60 / this.bpm / 2;
    if (this.next < now - 0.5) this.next = now + 0.05;          // recover after a stall
    if (this.nextDrop < now - 0.5) this.nextDrop = now + 0.05;
    while (this.next < ahead) { this.playStep(this.step++, this.next); this.next += stepDur; }
    while (this.nextDrop < ahead) {
      this.drop(this.nextDrop, 500 + Math.random() * 900, 0.05 + Math.random() * 0.08);
      if (Math.random() < 0.12) for (let q = 1; q <= 4; q++) this.drop(this.nextDrop + q * 0.045, 1200 + Math.random() * 1200, 0.03);
      this.nextDrop += 0.12 + Math.random() * Math.random() * 1.6;
    }
  },

  playStep(s, when) {
    if (s % 32 === 0) this.setChord((s >> 5) % PROGRESSION.length, when);
    if (s % 8 === 0) this.kick(when, 1);
    if (s % 16 === 11) this.kick(when, 0.45);
    if (Math.random() < 0.22) {
      const note = this.root + PROGRESSION[this.chordIdx][0] + 12 + PENTA[Math.floor(Math.random() * PENTA.length)];
      this.pluck(when, note, 0.035 + Math.random() * 0.03);
    }
  },

  drop(when, f0, vol) {                                 // water droplet: fast upward chirp
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(f0 * 2.6, when + 0.045);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    let out = g;
    if (ac.createStereoPanner) { out = ac.createStereoPanner(); out.pan.value = Math.random() * 1.6 - 0.8; g.connect(out); }
    o.connect(g); this.send(out, 0.6, 0.9, 0.25);
    o.start(when); o.stop(when + 0.12);
  },

  pluck(when, midi, vol) {                              // glassy bell
    const ac = this.ac, g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.6);
    [[1, 1], [2.01, 0.3]].forEach(([mult, amt]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.frequency.value = hz(midi) * mult; og.gain.value = amt;
      o.connect(og).connect(g); o.start(when); o.stop(when + 1.7);
    });
    this.send(g, 0.5, 0.9, 0.5);
  },

  kick(when, vol) {                                     // soft heartbeat
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(110, when);
    o.frequency.exponentialRampToValueAtTime(42, when + 0.25);
    g.gain.setValueAtTime(0.22 * vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.5);
    o.connect(g); this.send(g, 1, 0.15);
    o.start(when); o.stop(when + 0.55);
  },

  whoosh(when) {                                        // portal opening + a big plop
    const ac = this.ac, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noise;
    bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.setValueAtTime(150, when);
    bp.frequency.exponentialRampToValueAtTime(3500, when + 0.7);
    bp.frequency.exponentialRampToValueAtTime(300, when + 1.3);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.25, when + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.4);
    src.connect(bp).connect(g); this.send(g, 0.7, 1);
    src.start(when, Math.random() * 2); src.stop(when + 1.5);
    this.drop(when + 0.05, 260, 0.25);
    this.pluck(when + 0.3, this.root + 24, 0.06);
  },

  virus() {                                             // cute chiptune giggle
    if (!this.started || !this.on) return;
    const ac = this.ac, t0 = ac.currentTime + 0.02;
    [0, 4, 7, 12, 16, 19, 24].forEach((iv, q) => {
      const o = ac.createOscillator(), g = ac.createGain(), when = t0 + q * 0.055;
      o.type = 'square'; o.frequency.value = hz(this.root + 24 + iv);
      g.gain.setValueAtTime(0.035, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.07);
      o.connect(g); this.send(g, 1, 0.3, 0.3);
      o.start(when); o.stop(when + 0.08);
    });
  },

  blip() {                                              // pop-up opens / closes
    if (!this.started || !this.on) return;
    const ac = this.ac, t0 = ac.currentTime + 0.01;
    [0, 7].forEach((iv, q) => {
      const o = ac.createOscillator(), g = ac.createGain(), when = t0 + q * 0.06;
      o.type = 'square'; o.frequency.value = hz(this.root + 31 + iv);
      g.gain.setValueAtTime(0.025, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
      o.connect(g); this.send(g, 1, 0.3, 0.2);
      o.start(when); o.stop(when + 0.07);
    });
  },

  chime() {                                             // oracle card / wall post
    if (!this.started || !this.on) return;
    const t0 = this.ac.currentTime + 0.02;
    [0, 3, 7, 10, 12, 15, 19].forEach((iv, q) => this.pluck(t0 + q * 0.09, this.root + 12 + iv, 0.06));
  },
};

function lfo(ac, rate, depth, param) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = rate; g.gain.value = depth;
  o.connect(g).connect(param); o.start();
}

function noiseBuffer(ac, seconds) {                     // pink-ish noise
  const len = Math.floor(ac.sampleRate * seconds), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let n = 0; n < len; n++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0526;
    d[n] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
  }
  return buf;
}

function impulse(ac, seconds, decay) {                  // synthetic reverb tail
  const len = Math.floor(ac.sampleRate * seconds), buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let n = 0; n < len; n++) d[n] = (Math.random() * 2 - 1) * Math.pow(1 - n / len, decay);
  }
  return buf;
}


/* ---------- UTILITIES ------------------------------------------------ */

function frac(x) { return x - Math.floor(x); }

function hash(a, b, c = 0) {              // fast deterministic 0..1 noise
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = Math.imul(h ^ (h >>> 15), 2246822519);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function strHash(s) {                     // 32-bit FNV-1a
  let h = 2166136261;
  for (let n = 0; n < s.length; n++) h = Math.imul(h ^ s.charCodeAt(n), 16777619);
  return h >>> 0;
}

function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function invertHex(hex) { return '#' + (0xffffff ^ parseInt(hex.slice(1), 16)).toString(16).padStart(6, '0'); }
function lum(hex) { const [r, g, b] = rgb(hex); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function mix(a, b, t) {
  const A = rgb(a), B = rgb(b);
  return '#' + A.map((v, q) => Math.round(v + (B[q] - v) * t).toString(16).padStart(2, '0')).join('');
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function titleCase(s) { return s.toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase()); }

function readLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function writeLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode: fine */ }
}
